name: Generate Phalcon Template

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.1 with Phalcon
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer:v2
          extensions: pdo, pdo_mysql, mbstring, curl, zip, fileinfo, openssl, phalcon

      - name: Verify Phalcon
        run: |
          php -v
          php -m | grep -i phalcon
          php --ri phalcon

      - name: Install Phalcon DevTools
        run: |
          composer global require phalcon/devtools:"^5.0@dev" --dev
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH
          echo "$HOME/.config/composer/vendor/bin" >> $GITHUB_PATH

      - name: Verify DevTools
        run: |
          phalcon info
          phalcon commands

      - name: Generate project
        run: |
          phalcon project phalcon-erp simple

      - name: Compress template
        run: |
          zip -r phalcon-erp.zip phalcon-erp

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phalcon-erp-template
          path: phalcon-erp.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phalcon-template-${{ github.run_number }}
          name: Phalcon Template ${{ github.run_number }}
          files: phalcon-erp.zip